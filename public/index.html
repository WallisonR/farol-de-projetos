<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Farol da Carteira</title>
<style>
:root{--bg:#f2f5f7;--card:#fff;--ink:#14212b;--mut:#5a6b78;--ln:#d7dee4;--ac:#0f5c6e;--r:#c62f2f;--y:#c98a0b;--g:#2e8b57;--c:#8a97a2}
@media(prefers-color-scheme:dark){:root{--bg:#0e161c;--card:#16222b;--ink:#e6edf2;--mut:#93a4b0;--ln:#2a3a46;--ac:#5cc0d6}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,'Segoe UI',sans-serif}
header{padding:18px 20px 0;max-width:1100px;margin:auto}h1{font-size:22px;margin:0;font-weight:800}.sub,.m{color:var(--mut);font-size:13px}
nav{display:flex;gap:4px;padding:12px 20px 0;max-width:1100px;margin:auto;overflow-x:auto}
nav button{border:0;background:none;color:var(--mut);font:600 14px inherit;padding:8px 12px;border-bottom:3px solid transparent;cursor:pointer}nav button.on{color:var(--ink);border-color:var(--ac)}
main{max-width:1100px;margin:auto;padding:16px 20px 40px}h2{font-size:16px;margin:20px 0 8px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:18px}.k{background:var(--card);border:1px solid var(--ln);border-radius:6px;padding:10px 12px}.k b{font-size:24px;display:block}.k span{color:var(--mut);font-size:12px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:6px;padding:12px 14px;margin-bottom:8px}.card.cl{cursor:pointer}.card.cl:hover{border-color:var(--ac)}
.row{display:flex;gap:10px;align-items:flex-start}.dot{display:inline-block;width:14px;height:14px;border-radius:50%;flex:none;margin-top:3px;vertical-align:middle}
.R{background:var(--r)}.Y{background:var(--y)}.G{background:var(--g)}.C{background:var(--c)}
.tag{display:inline-block;font-size:12px;border:1px solid var(--ln);border-radius:4px;padding:1px 6px;margin-right:4px;color:var(--mut)}
.why{font-size:13px;margin:6px 0 0;padding-left:18px}.bar{display:flex;height:22px;border-radius:4px;overflow:hidden;margin:6px 0}.bar div{color:#fff;font-size:12px;text-align:center;line-height:22px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;background:var(--card)}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--ln);font-size:14px;white-space:nowrap}tr.cl{cursor:pointer}tr.cl:hover{background:var(--bg)}
.f{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}select,input,textarea{font:inherit;padding:6px 8px;border:1px solid var(--ln);border-radius:4px;background:var(--card);color:var(--ink)}
label{display:block;font-size:13px;color:var(--mut);margin-top:8px}label input,label select,label textarea{width:100%}
.md{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}.bx{background:var(--card);border-radius:8px;max-width:520px;width:100%;max-height:90vh;overflow:auto;padding:18px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:4px;padding:8px 14px;font:600 14px inherit;cursor:pointer;margin-top:14px}.btn.s{background:none;color:var(--ink);border:1px solid var(--ln)}.btn:disabled{opacity:.4}
.err{color:var(--r);font-size:13px;margin-top:8px}.ok{color:var(--g);font-size:13px;margin-top:8px}
</style></head><body>
<header><h1>Farol da Carteira</h1><div class="sub" id="sub"></div></header><nav id="nav"></nav><main id="v"></main>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const TIERS=["LE","ME","Growth","Legado"],TIPOS=["Implantação","Integração","Melhoria","Acompanhamento","Risco"],BL=["","Aguardando cliente","Aguardando AM","Aguardando engenharia","Aguardando produto","Aguardando terceiro","Outro"];
const NOME={R:"Vermelho",Y:"Amarelo",G:"Verde",C:"Cinza"};
let D=null,tab="d",F={},MSG="",IMP=null,FILE=null;
const tk=()=>{try{return localStorage.getItem("tk")||""}catch(e){return""}};
async function api(path,o={}){o.headers=Object.assign({"X-Usuario":"Wallison"},o.headers||{});if(tk())o.headers.Authorization="Bearer "+tk();
 const r=await fetch("/api"+path,o);
 if(r.status==401){const t=prompt("Token de acesso da API:");if(t){try{localStorage.setItem("tk",t)}catch(e){}return api(path,o)}throw{erros:["Sem acesso"],avisos:[]}}
 const j=await r.json().catch(()=>({}));if(!r.ok){const d=j.detail;throw{erros:d&&d.erros?d.erros:[typeof d=="string"?d:"Erro "+r.status],avisos:d&&d.avisos||[]}}return j}
const json=b=>({method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});
const dot=c=>`<span class="dot ${c}"></span>`,fd=s=>s?s.split("-").reverse().join("/"):"Não informado";
const card=p=>`<div class="card cl" onclick="edit(${p.id})"><div class="row">${dot(p.farol.cor)}<div><b>${esc(p.conta)}</b> · ${esc(p.nome)} <span class="tag">${p.tipo}</span><span class="tag">Prioridade ${p.prioridade.nivel} (${p.prioridade.score})</span><div class="m">${esc(p.farol.motivo)}</div><ul class="why">${p.prioridade.fatores.map(w=>"<li>"+esc(w)+"</li>").join("")}</ul><div class="m">Próxima ação: ${esc(p.proxima_acao)||"Não informado"}</div></div></div></div>`;
function dash(){const r=D.resumo,tot=r.projetos||1,bar=[["R",r.vermelho],["Y",r.amarelo],["G",r.verde],["C",r.cinza]].map(x=>x[1]?`<div class="${x[0]}" style="width:${x[1]/tot*100}%">${x[1]}</div>`:"").join("");
 const top=D.projetos.filter(p=>p.farol.cor!="G").slice(0,6),bd=Object.entries(r.bloqueios_por_dono);
 return`${MSG?`<div class="card ok">${esc(MSG)}</div>`:""}<div class="kp">${[["contas_ativas","Contas ativas"],["projetos","Projetos ativos"],["vermelho","Vermelhos"],["amarelo","Amarelos"],["verde","Verdes"],["cinza","Sem informação"],["bloqueados","Bloqueados"],["atrasados","Atrasados"]].map(k=>`<div class="k"><b>${r[k[0]]}</b><span>${k[1]}</span></div>`).join("")}<div class="k"><b>${(r.mrr_ativo/1e3).toFixed(0)}k</b><span>MRR ativo (R$)</span></div></div><div class="bar">${bar}</div><div class="m">Sem informação suficiente não conta como verde.</div><h2>Atenção imediata</h2>${top.map(card).join("")||'<div class="m">Nada crítico agora.</div>'}<h2>Bloqueios por responsável</h2>${bd.length?bd.map(e=>`<span class="tag">${esc(e[0])}: ${e[1]}</span>`).join(""):'<span class="m">Nenhum bloqueio.</span>'}`}
function contas(){const L=D.contas.filter(a=>(!F.t||a.nivel==F.t)&&(!F.q||(a.nome+" "+(a.segmento||"")).toLowerCase().includes(F.q.toLowerCase())));
 return`<div class="f"><input placeholder="Buscar conta ou segmento" value="${esc(F.q||"")}" oninput="F.q=this.value;render(1)"><select onchange="F.t=this.value;render()"><option value="">Todos os níveis</option>${TIERS.map(t=>`<option ${F.t==t?"selected":""}>${t}</option>`).join("")}</select></div><div class="tw"><table><tr><th></th><th>Conta</th><th>Nível</th><th>MRR</th><th>Segmento</th><th>Projetos</th></tr>${L.map(a=>{const ps=D.projetos.filter(p=>p.conta_id==a.id),w=["R","Y","C","G"].find(c=>ps.some(p=>p.farol.cor==c));return`<tr class="cl" onclick="conta(${a.id})"><td>${a.churn?dot("C"):dot(w||"G")}</td><td>${esc(a.nome)}</td><td>${a.nivel}</td><td>${a.mrr.toLocaleString("pt-BR",{minimumFractionDigits:2})}</td><td>${esc(a.segmento)||"Não informado"}</td><td>${a.churn?"Churn":ps.length||"Operação normal, sem projeto ativo"}</td></tr>`}).join("")}</table></div>`}
function projetos(){const L=D.projetos.filter(p=>(!F.f||p.farol.cor==F.f)&&(!F.q2||(p.conta+p.nome).toLowerCase().includes(F.q2.toLowerCase())));
 return`<div class="f"><input placeholder="Buscar conta ou projeto" value="${esc(F.q2||"")}" oninput="F.q2=this.value;render(2)"><select onchange="F.f=this.value;render()"><option value="">Todos os faróis</option>${Object.entries(NOME).map(o=>`<option value="${o[0]}" ${F.f==o[0]?"selected":""}>${o[1]}</option>`).join("")}</select></div>${L.map(card).join("")||'<div class="m">Nenhum projeto.</div>'}`}
async function hist(){const H=await api("/historico");return H.length?H.map(h=>`<div class="card"><b>${new Date(h.em+"Z").toLocaleString("pt-BR")}</b> · ${esc(h.rotulo)} <span class="m">(${esc(h.usuario)})</span><div class="m">${esc(h.campo)}: ${esc(h.valor_anterior)||"vazio"} → ${esc(h.valor_novo)||"vazio"}</div></div>`).join(""):'<div class="m">Nenhuma alteração registrada ainda.</div>'}
function modal(h){closeM();const d=document.createElement("div");d.className="md";d.id="m";d.onclick=e=>{if(e.target==d)closeM()};d.innerHTML=`<div class="bx">${h}</div>`;document.body.appendChild(d)}
function closeM(){const m=$("m");if(m)m.remove()}
async function conta(id){const a=await api("/contas/"+id);modal(`<h2 style="margin-top:0">${esc(a.nome)}</h2><div class="m">${a.nivel} · R$ ${a.mrr.toLocaleString("pt-BR",{minimumFractionDigits:2})} · ${esc(a.segmento)||"Segmento não informado"}</div><p>${esc(a.nota)||"Sem observações."}</p>${a.projetos.map(card).join("")||'<div class="m">Operação normal: acompanhada em nível de operação, sem projeto ativo.</div>'}<button class="btn s" onclick="closeM()">Fechar</button>`)}
function edit(id){const p=D.projetos.find(x=>x.id==id);modal(`<h2 style="margin-top:0">${dot(p.farol.cor)} ${esc(p.conta)} · ${esc(p.nome)}</h2><div class="m">${esc(p.farol.motivo)} · Prioridade ${p.prioridade.nivel} (impacto ${p.prioridade.impacto} + urgência ${p.prioridade.urgencia} + risco ${p.prioridade.risco})</div>
<label>Situação<textarea id="e_sit" rows="2">${esc(p.situacao)}</textarea></label><label>Prazo<input type="date" id="e_prazo" value="${p.prazo||""}"></label><label>Próxima ação<input id="e_prox" value="${esc(p.proxima_acao)}"></label>
<label>Bloqueio<select id="e_bo">${BL.map(b=>`<option ${p.bloqueio_dono==b||(!p.bloqueio_dono&&!b)?"selected":""}>${b}</option>`).join("")}</select></label><label>Motivo do bloqueio<input id="e_bm" value="${esc(p.bloqueio_motivo)}"></label>
<label><input type="checkbox" id="e_crit" style="width:auto" ${p.critico?"checked":""}> Situação crítica</label><label>Ajuste manual de impacto<select id="e_adj">${[-1,0,1].map(v=>`<option ${p.ajuste_impacto==v?"selected":""}>${v}</option>`).join("")}</select></label>
<div class="err" id="e_err"></div><button class="btn" onclick="save(${id})">Salvar</button> <button class="btn s" onclick="closeM()">Cancelar</button>`)}
async function save(id){const g=k=>$("e_"+k);try{await api("/projetos/"+id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({situacao:g("sit").value,prazo:g("prazo").value||null,proxima_acao:g("prox").value,bloqueio_dono:g("bo").value||null,bloqueio_motivo:g("bm").value||null,critico:g("crit").checked,ajuste_impacto:+g("adj").value})});closeM();await load()}catch(e){$("e_err").textContent=(e.erros||[e.message]).join(" · ")}}
const inp=(id,l,t="text")=>`<label>${l}<input id="${id}" type="${t}"></label>`,sel=(id,l,o)=>`<label>${l}<select id="${id}">${o.map(x=>`<option value="${esc(Array.isArray(x)?x[0]:x)}">${esc(Array.isArray(x)?x[1]:x)}</option>`).join("")}</select></label>`;
function cad(){return`<h2>Nova conta</h2><div class="card">${inp("c_n","Nome")}${sel("c_t","Nível",TIERS)}${inp("c_mrr","MRR (R$)")}${inp("c_seg","Segmento")}${inp("c_nota","Observações")}<button class="btn" onclick="cadC()">Cadastrar conta</button></div><h2>Novo projeto</h2><div class="card">${sel("p_c","Conta",D.contas.filter(a=>!a.churn).map(a=>[a.id,a.nome]))}${inp("p_n","Projeto")}${sel("p_t","Tipo",TIPOS)}${inp("p_sit","Situação")}${inp("p_prazo","Prazo","date")}${inp("p_prox","Próxima ação")}${sel("p_bo","Bloqueio",BL)}${inp("p_bm","Motivo do bloqueio")}<button class="btn" onclick="cadP()">Cadastrar projeto</button></div><div id="msg"></div>`}
const gv=i=>$(i).value;
async function envia(path,body,ok){try{const r=await api(path,json(body));MSG=ok+(r.avisos&&r.avisos.length?". Avisos: "+r.avisos.join(" · "):"");tab="d";await load()}catch(e){$("msg").innerHTML=`<div class="err">Não cadastrado: ${esc((e.erros||[e.message]).join(" · "))}</div>`}}
const cadC=()=>envia("/contas",{nome:gv("c_n"),nivel:gv("c_t"),mrr:gv("c_mrr"),segmento:gv("c_seg"),nota:gv("c_nota")},"Conta cadastrada");
const cadP=()=>envia("/projetos",{conta_id:+gv("p_c"),nome:gv("p_n"),tipo:gv("p_t"),situacao:gv("p_sit"),prazo:gv("p_prazo")||null,proxima_acao:gv("p_prox"),bloqueio_dono:gv("p_bo")||null,bloqueio_motivo:gv("p_bm")||null},"Projeto cadastrado");
function imp(){return`<h2>Importar Excel, CSV ou JSON</h2><div class="m">Contas: nome, nível, MRR, segmento, observações. Projetos: conta, projeto, tipo, situação, prazo, próxima ação, bloqueio, motivo do bloqueio. A aba ou arquivo com a coluna "projeto" é lido como projetos; as demais, como contas. Nada é gravado antes da sua confirmação. Aceita .xlsx, .csv e .json.</div><div class="f" style="margin-top:10px"><input type="file" accept=".xlsx,.xlsm,.csv,.json" onchange="prev(this.files[0])"></div><div id="pv">${pv()}</div>`}
async function prev(f){if(!f)return;FILE=f;const fd=new FormData();fd.append("arquivo",f);try{IMP=await api("/importacoes?dry_run=true",{method:"POST",body:fd})}catch(e){IMP={erro:(e.erros||[e.message]).join(" · ")}}$("pv").innerHTML=pv()}
function pv(){if(!IMP)return"";if(IMP.erro)return`<div class="err">${esc(IMP.erro)}</div>`;return`<div class="tw"><table><tr><th>Tipo</th><th>Linha</th><th>Registro</th><th>Resultado</th></tr>${IMP.linhas.map(x=>`<tr><td>${x.tipo}</td><td>${x.linha}</td><td>${esc(x.registro)}</td><td>${x.erros.length?dot("R")+" "+esc(x.erros.join("; ")):dot(x.avisos.length?"Y":"G")+" "+esc(x.avisos.join("; ")||"Pronto")}</td></tr>`).join("")}</table></div><button class="btn" ${IMP.validos?"":"disabled"} onclick="conf()">Importar ${IMP.validos} registros válidos</button>`}
async function conf(){const fd=new FormData();fd.append("arquivo",FILE);try{const r=await api("/importacoes",{method:"POST",body:fd});IMP=null;MSG=r.gravados+" registros importados"+(r.com_erro?" ("+r.com_erro+" linhas com erro ficaram de fora)":"")+".";tab="d";await load()}catch(e){IMP={erro:(e.erros||[e.message]).join(" · ")};$("pv").innerHTML=pv()}}
async function load(){try{D=await api("/carteira/farol");await render()}catch(e){$("v").innerHTML=`<div class="err">${esc((e.erros||[e.message]).join(" · "))}</div>`}}
async function render(keep){const T=[["d","Painel"],["c","Contas"],["p","Projetos"],["h","Histórico"],["n","Cadastro"],["i","Importar"]];
 $("nav").innerHTML=T.map(t=>`<button class="${tab==t[0]?"on":""}" onclick="tab='${t[0]}';MSG=tab=='d'?MSG:'';render()">${t[1]}</button>`).join("");
 $("sub").textContent="Atualizado em "+fd(D.hoje)+" · Wallison Rocha";
 const v=$("v");v.innerHTML=await({d:dash,c:contas,p:projetos,h:hist,n:cad,i:imp}[tab])();if(tab=="d")MSG="";
 if(keep){const i=v.querySelector("input");if(i){i.focus();i.setSelectionRange(99,99)}}}
load();
</script></body></html>
