document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()=="k"){e.preventDefault();busca()}});
/* ===== 13. ABA HISTÓRICO ===== */
async function hist(){const H=await api("/historico");return H.length?`<div class="tl">${H.map(h=>`<div class="it"><b>${esc(h.rotulo)}</b> <span class="m">· ${new Date(h.em+"Z").toLocaleString("pt-BR")} · ${esc(h.usuario)}</span><div class="m">${esc(h.campo)}: ${esc(h.valor_anterior)||"vazio"} → ${esc(h.valor_novo)||"vazio"}</div></div>`).join("")}</div>`:'<div class="box empty">Nenhuma alteração registrada ainda.</div>'}
/* ===== 14. JANELAS (detalhe da conta e edição do projeto) ===== */
function modal(h){closeM();const d=document.createElement("div");d.className="md";d.id="m";d.onclick=e=>{if(e.target==d)closeM()};d.innerHTML=`<div class="bx">${h}</div>`;document.body.appendChild(d)}
function closeM(){const m=$("m");if(m)m.remove()}
async function conta(id){const a=await api("/contas/"+id),f=(l,v)=>`<div><span>${l}</span>${v?esc(v):'<i class="m">Não informado</i>'}</div>`;
 modal(`<h3>${esc(a.nome)}</h3><div class="m"><span class="pill lv-${a.nivel}">${a.nivel}</span> R$ ${brl(a.mrr)}${a.churn?' · <b>Encerrada (churn)</b>':""}</div>
<div class="det">${f("Razão social",a.razao_social)}${f("CNPJ",a.cnpj)}${f("Segmento",a.segmento)}${f("Complexidade",a.complexidade)}${f("ERP / sistema",a.erp)}${f("Integrações",a.integracoes)}${f("Contato principal",a.contato_nome)}${f("E-mail",a.contato_email)}${f("Telefone / WhatsApp",a.contato_telefone)}${f("Responsável",a.responsavel)}${f("Início do contrato",a.data_inicio&&fd(a.data_inicio))}${f("Último contato",a.ultimo_contato&&fd(a.ultimo_contato))}${f("Próximo contato",a.proximo_contato&&fd(a.proximo_contato))}</div>
<p class="m">${esc(a.nota)||"Sem observações."}</p>${a.projetos.map(row).join("")||'<div class="m">Operação normal: acompanhada em nível de operação, sem projeto ativo.</div>'}<div class="acts"><button class="btn" onclick="editConta(${a.id})">Editar conta</button><button class="btn s" onclick="closeM()">Fechar</button></div>`)}
const CF=[["nome","Nome *"],["razao_social","Razão social"],["cnpj","CNPJ"],["nivel","Nível *","s",TIERS],["mrr","MRR (R$) *"],["segmento","Segmento"],["complexidade","Complexidade","s",["",...COMPLEX]],["erp","ERP / sistema"],["integracoes","Integrações"],["contato_nome","Contato principal"],["contato_email","E-mail do contato"],["contato_telefone","Telefone / WhatsApp"],["data_inicio","Início do contrato","date"],["ultimo_contato","Último contato","date"],["proximo_contato","Próximo contato","date"]];
function contaForm(px,a={}){const adm=ME&&ME.papel=="admin";return`<div class="fg">${CF.map(f=>f[2]=="s"?`<label class="fld">${f[1]}<select id="${px}${f[0]}">${f[3].map(o=>`<option ${a[f[0]]==o?"selected":""}>${o}</option>`).join("")}</select></label>`:`<label class="fld">${f[1]}<input id="${px}${f[0]}" type="${f[2]||"text"}" value="${esc(a[f[0]])}"></label>`).join("")}
${adm?`<label class="fld">Responsável (AM)<select id="${px}responsavel_id">${D.responsaveis.map(r=>`<option value="${r.id}" ${a.responsavel_id==r.id||(!a.id&&ME.id==r.id)?"selected":""}>${esc(r.nome)}</option>`).join("")}</select></label>`:""}</div><label class="fld">Observações<textarea id="${px}nota" rows="2">${esc(a.nota)}</textarea></label>`}
function contaVals(px){const o={};CF.forEach(f=>o[f[0]]=$(px+f[0]).value);o.nota=$(px+"nota").value;const r=$(px+"responsavel_id");if(r)o.responsavel_id=+r.value;return o}
function editConta(id){const a=D.contas.find(x=>x.id==id);modal(`<h3>Editar conta</h3>${contaForm("x_",a)}<div class="err" id="x_err"></div><div class="acts"><button class="btn" onclick="saveConta(${id})">Salvar</button><button class="btn s" onclick="closeM()">Cancelar</button></div>`)}
async function saveConta(id){try{await api("/contas/"+id,json(contaVals("x_"),"PATCH"));closeM();toast("Conta atualizada");await load()}catch(e){$("x_err").textContent=errs(e)}}
function edit(id){const p=D.projetos.find(x=>x.id==id);if(!p)return;modal(`<h3>${dot(p.farol.cor)} ${esc(p.conta)} / ${esc(p.nome)}</h3><div class="m">${esc(p.farol.motivo)}<br>Saúde do projeto: ${dot(p.farol.cor)} ${NOME[p.farol.cor]} · Saúde da conta: <i>sem leitura</i><br>Prioridade ${p.prioridade.nivel}: impacto ${p.prioridade.impacto} + urgência ${p.prioridade.urgencia} + risco ${p.prioridade.risco}</div>
<label class="fld">Situação<textarea id="e_sit" rows="2">${esc(p.situacao)}</textarea></label><div class="fg"><label class="fld">Prazo<input type="date" id="e_prazo" value="${p.prazo||""}"></label><label class="fld">Próxima ação<input id="e_prox" value="${esc(p.proxima_acao)}"></label>
<label class="fld">Bloqueio<select id="e_bo">${BL.map(b=>`<option ${p.bloqueio_dono==b||(!p.bloqueio_dono&&!b)?"selected":""}>${b}</option>`).join("")}</select></label><label class="fld">Motivo do bloqueio<input id="e_bm" value="${esc(p.bloqueio_motivo)}"></label>
<label class="fld">Ajuste manual de impacto<select id="e_adj">${[-1,0,1].map(v=>`<option ${p.ajuste_impacto==v?"selected":""}>${v}</option>`).join("")}</select></label><label class="fld"><br><input type="checkbox" id="e_crit" style="display:inline;width:auto" ${p.critico?"checked":""}> Situação crítica</label></div>
<div class="err" id="e_err"></div><div class="acts"><button class="btn" onclick="save(${id})">Salvar</button><button class="btn s" onclick="closeM()">Cancelar</button></div>`)}
async function save(id){const g=k=>$("e_"+k);try{await api("/projetos/"+id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({situacao:g("sit").value,prazo:g("prazo").value||null,proxima_acao:g("prox").value,bloqueio_dono:g("bo").value||null,bloqueio_motivo:g("bm").value||null,critico:g("crit").checked,ajuste_impacto:+g("adj").value})});closeM();toast("Projeto atualizado");await load()}catch(e){$("e_err").textContent=errs(e)}}
/* ===== 15. ABA CADASTRO (nova conta com todos os dados + novo projeto) ===== */
const inp=(id,l,t="text")=>`<label class="fld">${l}<input id="${id}" type="${t}"></label>`,sel=(id,l,o)=>`<label class="fld">${l}<select id="${id}">${o.map(x=>`<option value="${esc(Array.isArray(x)?x[0]:x)}">${esc(Array.isArray(x)?x[1]:x)}</option>`).join("")}</select></label>`;
function cad(){return`<div class="box"><h2>Nova conta</h2>${contaForm("c_")}<div class="acts"><button class="btn" onclick="cadC()">Cadastrar conta</button></div><div id="msgc"></div></div>
<div class="box" style="margin-top:16px"><h2>Novo projeto</h2><div class="fg">${sel("p_c","Conta",D.contas.filter(a=>!a.churn).map(a=>[a.id,a.nome]))}${inp("p_n","Projeto")}${sel("p_t","Tipo",TIPOS)}${inp("p_prazo","Prazo","date")}${sel("p_bo","Bloqueio",BL)}${inp("p_bm","Motivo do bloqueio")}</div>${inp("p_sit","Situação")}${inp("p_prox","Próxima ação")}<div class="acts"><button class="btn" onclick="cadP()">Cadastrar projeto</button></div><div id="msgp"></div></div>`}
const gv=i=>$(i).value;
async function envia(path,body,ok,box){try{const r=await api(path,json(body));toast(ok+(r.avisos&&r.avisos.length?". Avisos: "+r.avisos.join(" · "):""));tab=path=="/contas"?"c":"d";await load()}catch(e){$(box).innerHTML=`<div class="err">Não cadastrado: ${esc(errs(e))}</div>`}}
const cadC=()=>envia("/contas",contaVals("c_"),"Conta cadastrada","msgc");
const cadP=()=>envia("/projetos",{conta_id:+gv("p_c"),nome:gv("p_n"),tipo:gv("p_t"),situacao:gv("p_sit"),prazo:gv("p_prazo")||null,proxima_acao:gv("p_prox"),bloqueio_dono:gv("p_bo")||null,bloqueio_motivo:gv("p_bm")||null},"Projeto cadastrado","msgp");
/* ===== 15b. ABA USUÁRIOS (somente administrador) ===== */
async function usuarios(){const U=await api("/usuarios");return`<div class="grid2"><div class="box"><h2>Novo usuário</h2>${inp("u_e","E-mail","email")}${inp("u_n","Nome")}${inp("u_s","Senha provisória (mín. 8 caracteres)","password")}${sel("u_p","Perfil",[["am","AM (vê só as próprias contas)"],["admin","Administrador (vê tudo)"]])}<div class="acts"><button class="btn" onclick="addU()">Criar usuário</button></div><div id="msgu"></div><p class="m">Passe a senha provisória ao usuário; ele pode trocá-la em "Senha".</p></div>
<div class="tw"><table><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th></th></tr>${U.map(u=>`<tr><td><b>${esc(u.nome)}</b> ${u.ativo?"":'<span class="pill">inativo</span>'}</td><td>${esc(u.email)}</td><td>${u.papel=="admin"?"Administrador":"AM"}</td><td><a class="lk" onclick="togU(${u.id},${!u.ativo})">${u.ativo?"Desativar":"Reativar"}</a> · <a class="lk" onclick="resU(${u.id})">Redefinir senha</a></td></tr>`).join("")}</table></div></div>`}
async function addU(){try{await api("/usuarios",json({email:gv("u_e"),nome:gv("u_n"),senha:gv("u_s"),papel:gv("u_p")}));toast("Usuário criado");render()}catch(e){$("msgu").innerHTML=`<div class="err">${esc(errs(e))}</div>`}}
async function togU(id,ativo){try{await api("/usuarios/"+id,json({ativo},"PATCH"));render()}catch(e){toast(errs(e))}}
async function resU(id){const s=prompt("Nova senha provisória (mínimo 8 caracteres):");if(!s)return;try{await api("/usuarios/"+id,json({senha:s},"PATCH"));toast("Senha redefinida")}catch(e){toast(errs(e))}}
/* ===== 16. ABA IMPORTAR ===== */
function imp(){return`<div class="box"><h2>Importar Excel, CSV ou JSON</h2><div class="m">Contas: nome, nível, MRR, segmento, observações. Projetos: conta, projeto, tipo, situação, prazo, próxima ação, bloqueio, motivo do bloqueio. A aba ou arquivo com a coluna "projeto" é lido como projetos; as demais, como contas. Nada é gravado antes da sua confirmação.</div></div>
<label class="drop" style="margin-top:14px"><input type="file" hidden accept=".xlsx,.xlsm,.csv,.json" onchange="prev(this.files[0])"><b>Clique para escolher um arquivo</b><br><span class="m">.xlsx, .csv ou .json</span></label><div id="pv" style="margin-top:14px">${pv()}</div>`}
async function prev(f){if(!f)return;FILE=f;const fm=new FormData();fm.append("arquivo",f);try{IMP=await api("/importacoes?dry_run=true",{method:"POST",body:fm})}catch(e){IMP={erro:errs(e)}}$("pv").innerHTML=pv()}
function pv(){if(!IMP)return"";if(IMP.erro)return`<div class="err">${esc(IMP.erro)}</div>`;return`<div class="tw"><table><tr><th>Tipo</th><th>Linha</th><th>Registro</th><th>Resultado</th></tr>${IMP.linhas.map(x=>`<tr><td>${x.tipo}</td><td>${x.linha}</td><td>${esc(x.registro)}</td><td>${x.erros.length?dot("R")+" "+esc(x.erros.join("; ")):dot(x.avisos.length?"Y":"G")+" "+esc(x.avisos.join("; ")||"Pronto")}</td></tr>`).join("")}</table></div><div class="acts"><button class="btn" ${IMP.validos?"":"disabled"} onclick="conf()">Importar ${IMP.validos} registros válidos</button></div>`}
async function conf(){const fm=new FormData();fm.append("arquivo",FILE);try{const r=await api("/importacoes",{method:"POST",body:fm});IMP=null;toast(r.gravados+" registros importados"+(r.com_erro?" ("+r.com_erro+" linhas com erro ficaram de fora)":""));tab="d";await load()}catch(e){IMP={erro:errs(e)};$("pv").innerHTML=pv()}}
/* ===== 17. NAVEGAÇÃO, CABEÇALHO E CARGA ===== */
const TIT={c:["Contas","Sua carteira de clientes, com filtros por nível, complexidade, segmento e contato."],p:["Projetos","Todos os projetos ativos, por prioridade."],r:["Riscos","Projetos críticos e em atenção, por prioridade."],b:["Bloqueios","Projetos bloqueados e quem precisa atuar."],h:["Histórico","Alterações registradas, da mais recente para a mais antiga."],n:["Novo cadastro","Cadastre uma conta com todos os dados ou um novo projeto."],i:["Importar dados","Excel, CSV ou JSON, com validação antes de gravar."],u:["Usuários","Gerencie quem acessa o Farol."]};
const MES=["JAN","FEV","MAR","ABR","MAI","JUN","JUL","AGO","SET","OUT","NOV","DEZ"],DIAS=["Domingo","Segunda-feira","Terça-feira","Quarta-feira","Quinta-feira","Sexta-feira","Sábado"];
function menuNav(){const r=D?D.resumo:{},adm=ME&&ME.papel=="admin",it=(k,i,l,c,x="")=>`<button class="ni ${x} ${tab==k?"on":""}" onclick="go('${k}')"><i>${i}</i>${l}${c!=null?`<span class="ct">${c}</span>`:""}</button>`;
 return it("d","◉","Visão geral")+`<div class="ng">MINHA CARTEIRA</div>`+it("c","▣","Contas",r.contas_ativas)+it("p","☰","Projetos",r.projetos,"hi")+`<div class="ng">ATENÇÃO</div>`+it("r","⚡","Riscos",(r.vermelho||0)+(r.amarelo||0),"hi")+it("b","⛔","Bloqueios",r.bloqueados,"hi")+it("h","◷","Histórico")+`<div class="ng">GERENCIAR</div>`+it("n","＋","Novo cadastro",null,"sm")+it("i","⇪","Importar dados",null,"sm")+(adm?it("u","⚙","Usuários",null,"sm"):"")}
function drawer(o){$("app").classList.toggle("open",o)}
function go(t,f){tab=t;if(f!==undefined)F.f=f;drawer(false);render()}
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem("th",t)}catch(e){}}
function menu(ev){ev.stopPropagation();const d=$("dd"),lt=document.documentElement.dataset.theme=="light";d.innerHTML=`<div class="who"><b>${esc(ME.nome)}</b><span>${esc(ME.email)}</span></div><button onclick="setTheme('${lt?"dark":"light"}');menu(event)">${lt?"☾ Tema escuro":"☀ Tema claro"}</button><button onclick="senhaM();$('dd').classList.remove('on')">Alterar senha</button><button onclick="sair()">Sair</button>`;d.classList.toggle("on")}
document.addEventListener("click",()=>{const d=$("dd");if(d)d.classList.remove("on")});
const ago=()=>{if(!LOADED)return"";const m=Math.floor((Date.now()-LOADED)/6e4);return m<1?"Atualizado agora":"Atualizado há "+m+" min"};
setInterval(()=>{const u=$("upd");if(u)u.textContent=ago()},30000);
async function refresh(){const b=$("rf");b.classList.add("spin");await load();b.classList.remove("spin");toast("Dados atualizados")}
async function load(){try{D=await api("/carteira/farol");LOADED=Date.now();await render()}catch(e){if(tk())$("v").innerHTML=`<div class="box err">${esc(errs(e))}</div>`}}
async function render(keep){if(!D)return;$("nav").innerHTML=menuNav();$("av").textContent=(ME.nome||"?").trim().slice(0,1).toUpperCase();
 const dt=new Date(D.hoje+"T12:00"),h=new Date().getHours();
 if(tab=="d"){$("eb").textContent=String(dt.getDate()).padStart(2,"0")+" "+MES[dt.getMonth()]+" · "+DIAS[dt.getDay()];$("ttl").textContent=(h<12?"Bom dia":h<18?"Boa tarde":"Boa noite")+", "+ME.nome.split(" ")[0]+" 👋";$("sub").textContent="Aqui está o que merece sua atenção hoje."}
 else{$("eb").textContent="FAROL DA CARTEIRA";$("ttl").textContent=TIT[tab][0];$("sub").textContent=TIT[tab][1]}
 $("upd").textContent=ago();
 const v=$("v");v.innerHTML=await({d:dash,c:contas,p:projetos,r:riscos,b:bloqueios,h:hist,n:cad,i:imp,u:usuarios}[tab])();
 if(keep){const i=v.querySelector("input");if(i){i.focus();i.setSelectionRange(99,99)}}}
try{setTheme(localStorage.getItem("th")||"dark")}catch(e){}
if(tk())iniciar().catch(()=>{});else sair();
</script></body></html>
